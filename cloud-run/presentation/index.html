<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Where to watch a growing sewer</title>
  <link rel="stylesheet" href="assets/story.css">
</head>
<body>
  <div id="loading">Loading the Walkerville network…</div>
  <div id="stage">
    <canvas id="map" aria-label="Map of the Walkerville sewer network"></canvas>
    <div id="labels"></div>
  </div>
  <div id="source">Walkerville sample network · EPA SWMM · Simulation 2.5</div>
  <div id="furniture" aria-hidden="true">
    <div id="scale"><i></i><span></span></div>
    <div id="north"><svg viewBox="0 0 20 20"><path d="M10 1 L15 17 L10 13 L5 17 Z" fill="#5b6670"/></svg>N</div>
  </div>
  <aside id="panel" aria-live="polite"><div class="card" id="card"></div></aside>
  <nav id="bar" aria-label="Presentation">
    <div id="acts"></div>
    <span id="count"></span>
    <button class="nav" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 16 16"><path d="M10 3 L5 8 L10 13"/></svg></button>
    <button class="nav" id="next" type="button" aria-label="Next"><svg viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13"/></svg></button>
  </nav>
  <div id="tip" role="status"></div>

  <!-- Data first, each file sets one window variable. Generated by build/ (see README.md). -->
  <script src="data/story.js"></script>
  <script src="content/story.js"></script>
  <script src="assets/story.js"></script>
</body>
</html>
