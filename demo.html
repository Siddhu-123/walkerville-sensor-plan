<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walkerville Sensor Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/maplibre-gl.css" />
  <link rel="stylesheet" href="demo/welcome.css" />
  <link rel="stylesheet" href="demo/demo.css" />
</head>
<body class="is-welcome">
  <div id="loading">Loading Walkerville…</div>

  <div id="map" aria-hidden="true"></div>
  <div class="paper-texture-overlay"></div>
  <div id="stage">
    <canvas id="stage-canvas" aria-label="Map of the Walkerville sewer network"></canvas>
    <div id="labels"></div>
  </div>

  <div id="source">Walkerville sample network · EPA SWMM · Simulation 2.5</div>
  <div id="furniture" aria-hidden="true">
    <div id="scale"><i></i><span></span></div>
    <div id="north"><svg viewBox="0 0 20 20"><path d="M10 1 L15 17 L10 13 L5 17 Z" /></svg>N</div>
  </div>

  <aside class="welcome-sheet" id="sheet" aria-live="polite">
    <div class="welcome-rect-stack">
      <div class="blur-band b4"><div class="blur-shape"></div></div>
      <div class="blur-band b3"><div class="blur-shape"></div></div>
      <div class="blur-band b2"><div class="blur-shape"></div></div>
      <div class="blur-band b1"><div class="blur-shape"></div></div>
      <div class="blur-band b0"><div class="blur-shape"></div></div>
    </div>
    <div class="card" id="card"></div>
    <nav id="bar" aria-label="Presentation">
      <div id="acts"></div>
      <div class="bar-row">
        <span id="actname"></span>
        <span id="count"></span>
        <button class="nav" id="prev" type="button" aria-label="Previous"><svg viewBox="0 0 16 16"><path d="M10 3 L5 8 L10 13" /></svg></button>
        <button class="nav" id="next" type="button" aria-label="Next"><svg viewBox="0 0 16 16"><path d="M6 3 L11 8 L6 13" /></svg></button>
      </div>
    </nav>
  </aside>

  <div id="tip" role="status"></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="demo/basemap-data.js"></script>
  <script src="demo/basemap.js"></script>
  <script src="demo/story-data.js"></script>
  <script src="demo/scenes.js"></script>
  <script src="demo/engine.js"></script>
</body>
</html>
